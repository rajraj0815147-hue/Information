<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visiting Card Generator</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background: #1e293b; width: 100%; max-width: 420px; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; font-size: 22px; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }
    input { width: 100%; padding: 12px; border: 1px solid #334155; background: #0f172a; color: #fff; border-radius: 8px; font-size: 15px; outline: none; }
    input:focus { border-color: #38bdf8; }
    
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; background: #2563eb; color: white; margin-top: 10px; transition: 0.3s; }
    .btn:hover { background: #1d4ed8; }
    .btn-danger { background: #dc2626; margin-top: 15px; }
    .btn-danger:hover { background: #b91c1c; }

    /* Visiting Card Style */
    .card-preview { display: none; margin-top: 30px; background: linear-gradient(135deg, #1e3c72, #2a5298); padding: 20px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); position: relative; overflow: hidden; }
    .card-preview::after { content: ''; position: absolute; top: -30px; right: -30px; width: 100px; height: 100px; background: rgba(255,255,255,0.1); border-radius: 50%; }
    .card-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
    .card-avatar { width: 50px; height: 50px; background: #ff7043; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #fff; }
    .card-info h3 { font-size: 18px; color: #fff; text-transform: capitalize; }
    .card-info p { font-size: 13px; color: #cbd5e1; }
    .card-body { border-top: 1px solid rgba(255,255,255,0.2); padding-top: 12px; }
    .card-detail { font-size: 14px; margin-top: 6px; display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Visiting Card बनाएं</h2>
  
  <div class="form-group">
    <label>आपका नाम (Full Name)</label>
    <input type="text" id="fullName" placeholder="अपना नाम दर्ज करें">
  </div>
  
  <div class="form-group">
    <label>फोन नंबर (Phone Number)</label>
    <input type="tel" id="phoneNumber" placeholder="फ़ोन नंबर दर्ज करें">
  </div>
  
  <button class="btn" onclick="generateCard()">कार्ड बनाएं & सेव करें</button>

  <!-- Generated Visiting Card -->
  <div id="visitingCard" class="card-preview">
    <div class="card-header">
      <div class="card-avatar" id="cardAvatar">U</div>
      <div class="card-info">
        <h3 id="cardName">User Name</h3>
        <p>Verified Member</p>
      </div>
    </div>
    <div class="card-body">
      <div class="card-detail">📞 <span id="cardPhone">+91 0000000000</span></div>
    </div>
  </div>

  <button id="deleteBtn" class="btn btn-danger" style="display:none;" onclick="clearCard()">कार्ड डिलीट करें</button>
</div>

<script>
  // पेज लोड होने पर सेव किया हुआ डेटा ऑटोमैटिक दिखाएगा
  window.onload = function() {
    const savedData = JSON.parse(localStorage.getItem('userVisitingCard'));
    if(savedData) {
      renderCard(savedData.name, savedData.phone);
    }
  };

  function generateCard() {
    const name = document.getElementById('fullName').value.trim();
    const phone = document.getElementById('phoneNumber').value.trim();

    if(!name || !phone) {
      alert('कृपया नाम और फ़ोन नंबर दोनों भरें!');
      return;
    }

    // LocalStorage में डेटा सेव करना
    const userData = { name: name, phone: phone };
    localStorage.setItem('userVisitingCard', JSON.stringify(userData));

    renderCard(name, phone);
  }

  function renderCard(name, phone) {
    document.getElementById('cardName').innerText = name;
    document.getElementById('cardPhone').innerText = phone;
    document.getElementById('cardAvatar').innerText = name.charAt(0).toUpperCase();
    
    document.getElementById('visitingCard').style.display = 'block';
    document.getElementById('deleteBtn').style.display = 'block';
  }

  function clearCard() {
    localStorage.removeItem('userVisitingCard');
    document.getElementById('visitingCard').style.display = 'none';
    document.getElementById('deleteBtn').style.display = 'none';
    document.getElementById('fullName').value = '';
    document.getElementById('phoneNumber').value = '';
  }
</script>

</body>
</html>
